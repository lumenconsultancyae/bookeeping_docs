server {
    listen       80;
    server_name  localhost;

    # Allow large document uploads (base64 PDFs/images sent to agy-ai)
    client_max_body_size 50m;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri.html $uri/ =404;
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript;
        sub_filter 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js' '/__vendor__/pdf.min.js';
        sub_filter 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js' '/__vendor__/pdf.worker.min.js';
        sub_filter 'const vat = isVatApplicable ? (sub * 0.05) : 0;' 'const vat = (typeof isVatApplicable !== "undefined" ? isVatApplicable : (vatTreatment === "standard")) ? (sub * 0.05) : 0;';
        sub_filter 'if (isNew) itemPayload.qty = initialQty;' 'if (isNew) itemPayload.qty = 0;';
    }

    location /__vendor__/ {
        proxy_pass http://agy-ai:3000/__vendor__/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://agy-ai:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_set_header X-Lumen-Client $http_x_lumen_client;
        proxy_set_header X-Agy-Proxy-Secret $http_x_agy_proxy_secret;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}
