services:
  bookkeeping-app:
    image: nginx:alpine
    container_name: bookkeeping-web
    ports:
      - "9091:80"
    volumes:
      - ${HOST_APP_DIR:-../bookkeeping-tool}:/usr/share/nginx/html:ro
      - ${HOST_DOCS_DIR:-.}/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - agy-ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  agy-ai:
    build:
      context: .
      dockerfile: Dockerfile.agy
    image: bookkeeping-agy-ai:local
    container_name: bookkeeping-agy-ai
    command: python3 /app/agy_service.py
    ports:
      - "${AGY_HOST_PORT:-3000}:3000"
    environment:
      - AGY_HOST=0.0.0.0
      - AGY_PORT=3000
      - AGY_MODEL=${AGY_MODEL:-Gemini 4 Argon (High)}
    volumes:
      - ${HOST_DOCS_DIR:-.}/agy_service.py:/app/agy_service.py:ro
      - ${HOST_DOCS_DIR:-.}/state_repository.py:/app/state_repository.py:ro
      - ${HOST_DOCS_DIR:-.}/.agy_state/gemini:/root/.gemini
      - ${HOST_DOCS_DIR:-.}/.agy_state/conversations:/root/.gemini/antigravity-cli/conversations
      - ${HOST_DOCS_DIR:-.}/.agy_state/brain:/root/.gemini/antigravity-cli/brain
    networks:
      default:
      lumen_default:
        aliases:
          - agy-ai
          - flowise
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: bookkeeping-tunnel
    command: tunnel --url http://bookkeeping-app:80
    depends_on:
      - bookkeeping-app
    restart: unless-stopped

  agy-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: agy-tunnel
    command: tunnel --url http://agy-ai:3000
    depends_on:
      - agy-ai
    restart: unless-stopped

networks:
  lumen_default:
    external: true
