services:
  bookkeeping-app:
    image: nginx:alpine
    container_name: bookkeeping-web
    ports:
      - "9091:80"
    volumes:
      - ${HOST_APP_DIR:-/Users/wilsonr/Control/projects/bookeeping_4affdf/default/bookkeeping-tool}:/usr/share/nginx/html
      - ${HOST_DOCS_DIR:-/Users/wilsonr/Control/projects/bookeeping_4affdf/default/bookeeping_docs}/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - agy-ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  agy-ai:
    image: orchestration-agent:latest
    container_name: bookkeeping-agy-ai
    command: python3 /app/agy_service.py
    ports:
      - "3000:3000"
    environment:
      - AGY_HOST=0.0.0.0
      - AGY_PORT=3000
      - AGY_MODEL=Gemini 4 Argon (High)
    volumes:
      - ${HOST_DOCS_DIR:-/Users/wilsonr/Control/projects/bookeeping_4affdf/default/bookeeping_docs}/agy_service.py:/app/agy_service.py:ro
      - ${HOST_DOCS_DIR:-/Users/wilsonr/Control/projects/bookeeping_4affdf/default/bookeeping_docs}/.agy_state/conversations:/root/.gemini/antigravity-cli/conversations
      - ${HOST_DOCS_DIR:-/Users/wilsonr/Control/projects/bookeeping_4affdf/default/bookeeping_docs}/.agy_state/brain:/root/.gemini/antigravity-cli/brain
      - ${HOST_GEMINI_DIR:-/Users/wilsonr/.gemini}/config/antigravity-oauth-token:/root/.gemini/config/antigravity-oauth-token:ro
      - ${HOST_GEMINI_DIR:-/Users/wilsonr/.gemini}/antigravity-cli/antigravity-oauth-token:/root/.gemini/antigravity-cli/antigravity-oauth-token:ro
      - ${HOST_GEMINI_DIR:-/Users/wilsonr/.gemini}/antigravity-cli/settings.json:/root/.gemini/antigravity-cli/settings.json:ro
      - ${HOST_GEMINI_DIR:-/Users/wilsonr/.gemini}/config/settings.json:/root/.gemini/config/settings.json:ro
      - ${HOST_GEMINI_DIR:-/Users/wilsonr/.gemini}/antigravity-cli/builtin:/root/.gemini/antigravity-cli/builtin:ro
      - ${HOST_GEMINI_DIR:-/Users/wilsonr/.gemini}/config/builtin:/root/.gemini/config/builtin:ro
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: bookkeeping-tunnel
    command: tunnel --url http://bookkeeping-app:80
    depends_on:
      - bookkeeping-app
    restart: unless-stopped

  agy-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: agy-tunnel
    command: tunnel --url http://agy-ai:3000
    depends_on:
      - agy-ai
    restart: unless-stopped
